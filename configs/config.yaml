# ===============================
# 기본 설정
# ===============================
project:
  name: "endoscopy_multitask"
  seed: 42
  device: "cuda"   # cuda | cpu

# ===============================
# 입력 데이터
# ===============================
input:
  image_size: 512
  channels: 3

# ===============================
# Task 설정 (핵심)
# ===============================
task:
  detection: true
  segmentation: true

# ===============================
# 모델 설정
# ===============================
model:
  backbone: "resnet50"
  pretrained: true

# ===============================
# Detection 설정
# ===============================
detection:
  num_classes: 1          # polyp
  class_names:
    - polyp
  confidence_threshold: 0.25
  iou_threshold: 0.5

# ===============================
# Segmentation 설정
# ===============================
segmentation:
  num_classes: 1
  activation: "sigmoid"

# ===============================
# Loss 가중치
# ===============================
loss:
  detection_weight: 1.0
  segmentation_weight: 1.0

# ===============================
# 데이터 경로
# ===============================
data:
  train:
    images: "./Training/1.원천데이터"
    masks:  "./Training/2.라벨링데이터"
    boxes:  "./Training/2.라벨링데이터"
  val:
    images: "./Validation/1.원천데이터"
    masks:  "./Validation/2.라벨링데이터"
    boxes:  "./Validation/2.라벨링데이터"

# ===============================
# 학습 설정
# ===============================
train:
  batch_size: 4
  epochs: 50
  lr: 0.0001
  optimizer: "Adam"

# ===============================
# 저장 / 로그
# ===============================
output:
  save_dir: "./outputs"
  log_dir: "./logs"