model:
  backbone: "resnet50"
  pretrained: true

input:
  image_size: 512
  channels: 3

task:
  detection: true
  segmentation: true

detection:
  num_classes: 1          # polyp = 1
  confidence_threshold: 0.25
  iou_threshold: 0.5

segmentation:
  num_classes: 1          # binary mask
  activation: "sigmoid"  # binary segmentation

loss:
  detection_weight: 1.0
  segmentation_weight: 1.0
